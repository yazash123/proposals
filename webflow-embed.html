<!-- The sitting: proposals. Paste into ONE Webflow Code Embed, in a full-width section (not a Container). -->
<div id="hotp-sit-wrap" style="width:100%;margin:0;padding:0">
  <iframe id="hotp-sit"
    title="Draft a proposal for the House of the People"
    data-src="https://yazash123.github.io/proposals/"
    allow="clipboard-write"
    style="display:block;width:100%;height:100vh;height:100dvh;border:0;background:#1C3150"></iframe>
</div>
<script>
(function(){
  var f=document.getElementById('hotp-sit'), base=f.getAttribute('data-src');
  // Links: #wall opens the wall so far, #hosts the hosts' tab, no hash the risk map and the proposal window.
  // #k=CODE carries the House code from the link in the members' email, so they only have to type their name.
  function pass(){
    var h=/^#(wall|hosts|k=[\w-]{3,40})$/.test(location.hash)?location.hash:'';
    if(f.getAttribute('src')!==base+h) f.setAttribute('src',base+h);
  }
  pass(); window.addEventListener('hashchange',pass);
})();
</script>
